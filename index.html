<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Medical Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.0/flowbite.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { teal: '#0F4C5C', gold: '#C5A880', cream: '#F9F9F8' } } }
        }
    </script>
    <style>body { font-family: 'Inter', sans-serif; } h1, h2, h3 { font-family: 'Playfair Display', serif; }</style>
</head>
<body class="bg-cream text-[#1A1A1A]">

    <!-- Navbar -->
    <nav class="p-6 flex justify-between items-center bg-white shadow-sm sticky top-0 z-50">
        <span class="text-2xl font-bold text-teal">ELITE MEDICAL</span>
        <a href="#booking" class="bg-gold text-white px-6 py-3 rounded-full font-semibold hover:bg-teal transition">Book Consultation</a>
    </nav>

    <!-- Hero Section -->
    <section class="grid lg:grid-cols-2 gap-12 p-12 items-center">
        <div class="space-y-6">
            <h1 class="text-6xl text-teal">Clinical Excellence, Refined Luxury.</h1>
            <p class="text-lg text-gray-600">Experience world-class medical precision with a compassionate, patient-first approach.</p>
            <a href="#booking" class="inline-block bg-teal text-white px-8 py-4 rounded-full font-bold hover:bg-gold transition">Book Consultation</a>
        </div>
        <img src="https://images.unsplash.com/photo-1559839734-2b71ea197ec2?w=800" class="rounded-3xl shadow-2xl h-[500px] w-full object-cover">
    </section>

    <!-- Services Bento -->
    <section class="p-12">
        <h2 class="text-4xl text-center mb-12 text-teal">Our Specialties</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-2 row-span-2 bg-white p-8 rounded-3xl shadow-lg border border-gray-100 flex flex-col justify-end">
                <h3 class="text-2xl text-teal">Advanced Dermatology</h3>
            </div>
            <div class="bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
                <h3 class="text-xl text-teal">Dental Care</h3>
            </div>
            <div class="bg-white p-8 rounded-3xl shadow-lg border border-gray-100">
                <h3 class="text-xl text-teal">Aesthetics</h3>
            </div>
        </div>
    </section>

</body>
</html>
